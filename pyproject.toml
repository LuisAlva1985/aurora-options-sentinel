[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-options-sentinel"
version = "0.1.0"
description = "Paper-only autonomous options agent with fail-closed risk gates"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Luis Antonio Alvarado Salas" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
